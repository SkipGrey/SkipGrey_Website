name: Deploy SkipGrey Fashion

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/skipgrey_github_actions
          chmod 600 ~/.ssh/skipgrey_github_actions
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/skipgrey_github_actions -o StrictHostKeyChecking=yes" \
            dist/ \
            "${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/var/www/skipgrey/"